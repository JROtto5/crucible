[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-review"
dynamic = ["version"]
description = "An independent, evidence-first reviewer for the pull requests you send to other people's projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/JROtto5/crucible"

[project.scripts]
crucible = "crucible.cli:main"

[tool.setuptools]
packages = ["crucible"]

[tool.setuptools.package-data]
crucible = ["guides/*.md"]

[tool.setuptools.dynamic]
version = {attr = "crucible.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["eval/cases"]   # fixture repos with planted bugs, on purpose

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # pyflakes + syntax; newer ruff defaults enable far more
ignore = ["E401", "E701", "E702", "E731", "E741"]   # the codebase's compact style: one-line imports, `a = 1; b = 2`, `l`
