name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for fixture repos
        run: git config --global user.name ci && git config --global user.email ci@example.invalid && git config --global init.defaultBranch main
      - name: unit tests
        run: python -m unittest discover -s tests -v
