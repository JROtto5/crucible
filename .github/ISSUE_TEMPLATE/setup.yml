name: Can't get it running
description: Install, login or first-review trouble
labels: [setup]
body:
  - type: textarea
    id: doctor
    attributes:
      label: crucible doctor
      description: The output of `crucible doctor` (it lists what's missing). Remove anything private first.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
      description: The command, the last lines of its output, and your OS.
      render: text
    validations:
      required: true
